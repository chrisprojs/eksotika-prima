[build]
  command = "npm run prisma:generate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[functions]
  included_files = ["prisma/prod.db"]

[[redirects]]
  from = "https://www.eksotikaprima.netlify.app/*"
  to = "https://eksotikaprima.netlify.app/:splat"
  status = 301
  force = true

[[plugins]]
  package = "@netlify/plugin-nextjs"
